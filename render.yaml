services:
  - type: web
    name: omniops-slack-agent
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_USER_TOKEN
        sync: false
      - key: PORT
        value: 10000
